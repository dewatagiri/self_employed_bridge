# Production template. Every null must be set (from pilot evidence) before live use.
# No Malaysian loss data exists: do not fill these from guesses.
meta:
  demo: false
screen:
  allowed_payer_types: [household, individual, small_business]
  refer_contract_payer_types: [company, agency, glc]   # go to contract or invoice financing
  min_materials_share_of_quote: null    # Q2: materials_cost / quote_total must be at least this
  deposit_to_materials_share: 1.0       # author decision A2, 20 Nov 2026: the whole deposit counts first
release:
  require_deposit_from_payer_account: true
  require_payer_not_related: true
  require_pdpa_consent: true
  require_kyc_verified: true             # borrower eKYC result must be 'verified'
  require_payer_identity_confirmed: true
  margin_of_advance: null              # max bridge as a share of the quoted materials cost; never above 1.0
  require_registration: true             # author decision A11: business registration needed...
  registration_waiver_first_bridge_max: null  # ...except a first bridge at or below this (if the financier's rules allow); null = no waiver
  auto_approve_max_amount: null         # template jobs at or below this skip manual review
  template_match_min: null              # 0 to 1 match between quote materials list and trade template
caps:                                   # exposure limits, all RM
  per_bridge: null
  per_borrower_live: null
  per_supplier_live: null
  per_sponsor_cohort: null
  pilot_total: null
  max_live_bridges_per_borrower: null
  step_up_tiers: null                   # author decision A11: list of {after_clean_repayments, max_live_bridges_per_borrower, per_borrower_live}; null = no step-up
borrower:
  require_credit_bureau_check: true
  decline_on_adverse_record: true
  decline_on_screening_true_match: true # sanctions / financial-crime screening; possible match or PEP -> manual review
  min_trade_months_or_jobs: null        # met if trade months OR completed jobs reach this
tenor:
  grace_days: null                      # not used by any module yet
  two_step_release_over_amount: null    # larger jobs release in two steps (stage 1 = this amount)
  typical_days: null                    # expected days from release to repayment
pricing:
  flat_fee_per_bridge: null             # RM
  guarantee_fee_rate_on_drawn: null     # annual rate, charged on drawn amount only
  cost_to_serve_per_bridge: null        # RM, measured in the pilot
  all_in_rate_cap_pa: null              # max the borrower pays in total (financier fee + guarantee fee), per annum, simple interest
  fee_ceiling_reference:                # published benchmark, used only as a warning
    rate_per_month: 0.015               # author decision A10: two sources give the same figure
    note: "Not like-for-like. A fee well above it needs a stated reason."
    sources:
      - "public contract financing scheme charge, 1.5% a month (handover s.10; author to confirm the product)"
      - "top of the market invoice financing range, 0.8-1.5% a month (market_reference, pending A9)"
layers:
  first_loss_reserve: null              # RM, sponsor-funded, per cohort
  guarantor_enabled: true               # author decision, 20 Nov 2026: a guarantee provider covers part of the loss
  guarantor_cover_pct: null             # share of loss above the reserve
  guarantor_cap: null                   # RM, programme cap
financier:
  type: development_institution          # author decision, 20 Nov 2026 (bank | development_institution | licensed_moneylender | other)
  moneylender_caps: {secured: 0.12, unsecured: 0.18}   # Moneylenders Act 1951, per annum, simple interest (public)
  cost_of_funds_pa: null           # the DFI's cost of the debt that funds the drawn amount, per annum
  capital_pct_of_drawn: null       # equity the DFI holds against the drawn amount
  cost_of_equity_pa: null          # the DFI's required return on that equity (its hurdle)
guarantor:                              # the guarantee provider's own costs (author decision A15)
  cost_of_capital_pa: null          # its required return on the capital it sets aside (the guarantee cap)
  admin_cost_per_bridge: null           # RM to monitor and administer each guaranteed bridge
collections:
  days_past_due_reminder: null
  days_past_due_notice: null
  days_past_due_escalate: null
  write_off_after_days: null
  min_expected_recovery_to_chase: null  # stop chasing when expected recovery is below cost of chasing
stop_lines:                             # candidates to test, not findings
  pause_if_bypass_rate_over: null       # candidate to test, not a finding
  bypass_rate_min_bridges: null         # bridges released before the bypass stop line is tested
  pause_if_loss_rate_over: null         # loss trip wire (author decision A14): pause new bridges when the loss so far, after recoveries, is above this share of money lent. Demo leaves it off; the damage section shows its effect
  loss_rate_min_bridges: null          # known-outcome bridges needed before the trip wire can fire
  outcome_lag_bridges: null            # bridges released while earlier outcomes are still unknown, so they cannot be stopped
  target_quote_to_supplier_payment_hours: null
gates:                                  # pass thresholds, not in the design; leave null until set
  gate0_min_share: null
  gate1_min_share: null
  gate2_min_on_time_share: null
  gate2_max_bypass_rate: null
  gate2_max_loss_to_reserve: null       # loss / first-loss reserve
  gate3_min_fee_cover_ratio: null       # fee collected / (cost to serve + loss)
  gate4_min_new_to_credit_share: null   # additionality: share of borrowers new to formal credit
  gate4_min_job_needed_share: null      # additionality: share who say the job would not go ahead without the bridge
simulation:
  n_bridges: null
  n_runs: null
  seed: 42
  cohort_days: null                       # how long one cohort runs; the guarantor's capital is set aside this long
  amount_distribution: null             # materials cost of bridged jobs, e.g. {kind: lognormal, mean: , sigma: } (of ln RM)
  deposit_share_of_materials: null      # e.g. {low: , high: } uniform; deposit / materials for bridged jobs
  outcome_probs: null                   # on_time, late, bypass, dispute, abandoned (sum to 1)
  recovery_rate_by_outcome: null
  damage_dispute_share: null          # of a damage rate, the share that is a rejected project (the rest are not completed)
sliders:                                # values the report precomputes for its sliders; null = no slider
  margin_of_advance: null
  flat_fee_per_bridge: null
  first_loss_reserve: null
development:
  pricing_basis: developmental          # author decision A13: priced below a commercial return on purpose; funders accept a planned loss in return for additionality
  funder_loss_budget_per_cohort: null   # RM the DFI and guarantor together agree they can lose per cohort; null = no budget set yet
dev_sliders:                            # values the developmental-pricing section precomputes; null = section hidden
  all_in_cap_pa: null
  guarantee_fee_pa: null
  guarantor_cover_pct: null
  cost_to_serve_per_bridge: null
damage_sliders:                         # values the damage / trip wire section precomputes; null = section hidden
  damage_rate: null
  loss_per_damaged_loan: null
  trip_wire: null                      # list; null inside the list means no trip wire
market_reference:                       # public, dated; comparison only, never used in a decision
  approved_by_author: false             # flip to true once the author has checked each source
  margin_of_advance:                    # market products measure it against contract or invoice value
    - {basis: contract value, max: 0.90, source: "P2P contract financing product page, accessed Nov 2026"}
    - {basis: contract value, max: 0.90, source: "public contract-financing guarantee scheme listing, Apr 2024"}
    - {basis: contract cost, max: 1.00, source: "development bank contract financing disclosure sheet, Jun 2023; needs 5-15% cash collateral"}
    - {basis: invoice value, max: 0.80, source: "P2P invoice financing product page, accessed Nov 2026"}
    - {basis: invoice value, max: 0.90, source: "invoice financing explainer, typical 80-90%, accessed Nov 2026"}
  monthly_cost:                         # headline rates; fees on top are listed in `plus`
    - {low: 0.008, high: 0.015, plus: "platform fee 0.75-2.25% of amount", source: "P2P invoice financing FAQ, accessed Nov 2026"}
    - {low: 0.010, high: 0.010, plus: "1.5% origination per drawdown; 2.5% one-off processing", source: "P2P invoice financing product page, accessed Nov 2026"}
