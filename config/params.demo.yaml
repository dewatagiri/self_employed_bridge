# DEMO PARAMETERS. Every value marked below is made up so the engine can run end to end.
meta:
  demo: true                            # DEMO ONLY, not a finding
screen:
  allowed_payer_types: [household, individual, small_business]
  refer_contract_payer_types: [company, agency, glc]
  min_materials_share_of_quote: 0.25    # DEMO ONLY, not a finding
  deposit_to_materials_share: 1.0       # author decision A2, 20 Nov 2026
release:
  require_deposit_from_payer_account: true
  require_payer_not_related: true
  require_pdpa_consent: true
  require_kyc_verified: true             # borrower eKYC result must be 'verified'
  require_payer_identity_confirmed: true
  margin_of_advance: 0.95   # DEMO ONLY, not a finding
  require_registration: true             # author decision A11: business registration needed...
  registration_waiver_first_bridge_max: 2000   # DEMO ONLY, not a finding
  auto_approve_max_amount: 5000         # DEMO ONLY, not a finding
  template_match_min: 0.8               # DEMO ONLY, not a finding
caps:
  per_bridge: 10000                     # DEMO ONLY, not a finding
  per_borrower_live: 15000              # DEMO ONLY, not a finding
  per_supplier_live: 50000              # DEMO ONLY, not a finding
  per_sponsor_cohort: 200000            # DEMO ONLY, not a finding
  pilot_total: 500000                   # DEMO ONLY, not a finding
  max_live_bridges_per_borrower: 2      # DEMO ONLY, not a finding
  step_up_tiers:                        # author decision A11; tiers after clean repayments
    - {after_clean_repayments: 3, max_live_bridges_per_borrower: 3, per_borrower_live: 25000}   # DEMO ONLY, not a finding
    - {after_clean_repayments: 8, max_live_bridges_per_borrower: 4, per_borrower_live: 40000}   # DEMO ONLY, not a finding
borrower:
  require_credit_bureau_check: true
  decline_on_adverse_record: true
  decline_on_screening_true_match: true # sanctions / financial-crime screening; possible match or PEP -> manual review
  min_trade_months_or_jobs: 6           # DEMO ONLY, not a finding
tenor:
  grace_days: 7                         # DEMO ONLY, not a finding
  two_step_release_over_amount: 8000    # DEMO ONLY, not a finding
  typical_days: 30   # DEMO ONLY, not a finding
pricing:
  flat_fee_per_bridge: 60               # DEMO ONLY, not a finding
  guarantee_fee_rate_on_drawn: 0.02     # DEMO ONLY, not a finding
  cost_to_serve_per_bridge: 25          # DEMO ONLY, not a finding
  all_in_rate_cap_pa: 0.18   # DEMO ONLY, not a finding
  fee_ceiling_reference:
    rate_per_month: 0.015               # author decision A10: two sources give the same figure
    note: "Not like-for-like. A fee well above it needs a stated reason."
    sources:
      - "public contract financing scheme charge, 1.5% a month (handover s.10; author to confirm the product)"
      - "top of the market invoice financing range, 0.8-1.5% a month (market_reference, pending A9)"
layers:
  first_loss_reserve: 10000             # DEMO ONLY, not a finding
  unused_reserve_returned: true         # author decision A16: what the cohort does not spend goes back to the sponsor once its loans are closed and recoveries are in
  guarantor_enabled: true               # DEMO ONLY, not a finding
  guarantor_cover_pct: 0.5              # DEMO ONLY, not a finding
  guarantor_cap: 5000                   # DEMO ONLY, not a finding
financier:
  type: development_institution          # author decision, 20 Nov 2026
  moneylender_caps: {secured: 0.12, unsecured: 0.18}
  cost_of_funds_pa: 0.04   # DEMO ONLY, not a finding
  capital_pct_of_drawn: 0.08   # DEMO ONLY, not a finding
  cost_of_equity_pa: 0.12   # DEMO ONLY, not a finding
sponsor:                               # who funds the first-loss reserve (author decision A16)
  cost_of_funds_pa: 0.04   # DEMO ONLY, not a finding
guarantor:                              # the guarantee provider's own costs (author decision A15)
  cost_of_capital_pa: 0.10   # DEMO ONLY, not a finding
  admin_cost_per_bridge: 2   # DEMO ONLY, not a finding
collections:
  days_past_due_reminder: 3             # DEMO ONLY, not a finding
  days_past_due_notice: 14              # DEMO ONLY, not a finding
  days_past_due_escalate: 30            # DEMO ONLY, not a finding
  write_off_after_days: 120             # DEMO ONLY, not a finding
  min_expected_recovery_to_chase: 0     # DEMO ONLY, not a finding
stop_lines:
  pause_if_bypass_rate_over: 0.10       # DEMO ONLY, not a finding
  bypass_rate_min_bridges: 20   # DEMO ONLY, not a finding
  pause_if_loss_rate_over: null         # loss trip wire (author decision A14): pause new bridges when the loss so far, after recoveries, is above this share of money lent. Demo leaves it off; the damage section shows its effect
  loss_rate_min_bridges: 20   # DEMO ONLY, not a finding
  outcome_lag_bridges: 10   # DEMO ONLY, not a finding
  target_quote_to_supplier_payment_hours: 4   # DEMO ONLY, not a finding
gates:
  gate0_min_share: null
  gate1_min_share: null
  gate2_min_on_time_share: null
  gate2_max_bypass_rate: null
  gate2_max_loss_to_reserve: null
  gate3_min_fee_cover_ratio: null
  gate4_min_new_to_credit_share: null
  gate4_min_job_needed_share: null
simulation:
  n_bridges: 100                        # DEMO ONLY, not a finding
  n_runs: 1000                          # DEMO ONLY, not a finding
  seed: 42
  cohort_days: 90   # DEMO ONLY, not a finding
  amount_distribution: {kind: lognormal, mean: 8.3, sigma: 0.5}   # DEMO ONLY, not a finding
  deposit_share_of_materials: {low: 0.1, high: 0.6}   # DEMO ONLY, not a finding
  outcome_probs: {on_time: 0.80, late: 0.10, bypass: 0.05, dispute: 0.03, abandoned: 0.02}   # DEMO ONLY, not a finding
  recovery_rate_by_outcome: {on_time: 1.0, late: 0.95, bypass: 0.5, dispute: 0.7, abandoned: 0.3}   # DEMO ONLY, not a finding
  damage_dispute_share: 0.6   # DEMO ONLY, not a finding
sliders:                                # values the report precomputes for its sliders
  margin_of_advance: [0.80, 0.85, 0.90, 0.95, 1.00]   # DEMO ONLY, not a finding
  flat_fee_per_bridge: [30, 45, 60, 75, 90]   # DEMO ONLY, not a finding
  first_loss_reserve: [5000, 7500, 10000, 15000, 20000]   # DEMO ONLY, not a finding
development:
  pricing_basis: developmental          # author decision A13
  funder_loss_budget_per_cohort: 2000   # DEMO ONLY, not a finding
dev_sliders:
  all_in_cap_pa: [0.12, 0.15, 0.18, 0.21]   # DEMO ONLY, not a finding
  guarantee_fee_pa: [0.02, 0.035, 0.05, 0.07]   # DEMO ONLY, not a finding
  guarantor_cover_pct: [0.5, 0.6, 0.7, 0.8]   # DEMO ONLY, not a finding
  cost_to_serve_per_bridge: [5, 10, 15, 25, 35]   # DEMO ONLY, not a finding
damage_sliders:                         # values the damage / trip wire section precomputes; null = section hidden
  damage_rate: [0.02, 0.03, 0.04, 0.05, 0.07]   # DEMO ONLY, not a finding
  loss_per_damaged_loan: [0.3, 0.5, 0.7, 1.0]   # DEMO ONLY, not a finding
  trip_wire: [null, 0.02, 0.03, 0.04, 0.06]   # DEMO ONLY, not a finding
market_reference:                       # public, dated; comparison only, never used in a decision
  approved_by_author: false             # flip to true once the author has checked each source
  margin_of_advance:                    # market products measure it against contract or invoice value
    - {basis: contract value, max: 0.90, source: "P2P contract financing product page, accessed Nov 2026"}
    - {basis: contract value, max: 0.90, source: "public contract-financing guarantee scheme listing, Apr 2024"}
    - {basis: contract cost, max: 1.00, source: "development bank contract financing disclosure sheet, Jun 2023; needs 5-15% cash collateral"}
    - {basis: invoice value, max: 0.80, source: "P2P invoice financing product page, accessed Nov 2026"}
    - {basis: invoice value, max: 0.90, source: "invoice financing explainer, typical 80-90%, accessed Nov 2026"}
  monthly_cost:                         # headline rates; fees on top are listed in `plus`
    - {low: 0.008, high: 0.015, plus: "platform fee 0.75-2.25% of amount", source: "P2P invoice financing FAQ, accessed Nov 2026"}
    - {low: 0.010, high: 0.010, plus: "1.5% origination per drawdown; 2.5% one-off processing", source: "P2P invoice financing product page, accessed Nov 2026"}
